[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeonet-modernized"
version = "0.2.0rc2"
description = "Modern, reproducible geomorphological feature and drainage-network extraction"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["License.txt"]
authors = [{name = "Original pyGeoNet contributors"}]
dependencies = [
  # pysheds 0.5 calls np.in1d, which NumPy 2.4 removed. Remove this cap after upstream fixes it.
  "numpy>=1.26,<2.4",
  "networkx>=3.2",
  "pysheds==0.5",
  "rasterio>=1.3,<1.4.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "rasterio>=1.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numba==0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "llvmlite==0.45.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
geo = []
dev = [
  "bandit>=1.9",
  "build>=1.2",
  "mypy>=1.11",
  "types-networkx>=3.2",
  "pytest>=8",
  "ruff>=0.8",
  "pre-commit>=4",
]

[project.scripts]
pygeonet = "pygeonet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests_modern"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["legacy", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pygeonet"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*", "affine", "pysheds", "pysheds.*", "pyproj"]
ignore_missing_imports = true
